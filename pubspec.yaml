name: tejamkor
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  go_router: ^17.1.0
  flutter_svg: ^2.2.3
  shared_preferences: ^2.5.4
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  build_runner: ^2.12.2
  json_serializable: ^6.13.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
  fonts:
    - family: San Francisco Pro Display
      fonts:
        - asset: fonts/San Francisco Pro Display/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: fonts/San Francisco Pro Display/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: fonts/San Francisco Pro Display/SF-Pro-Display-SemiBold.otf
          weight: 600
        - asset: fonts/San Francisco Pro Display/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: fonts/San Francisco Pro Display/SF-Pro-Display-Black.otf
          weight: 900




  uses-material-design: true
